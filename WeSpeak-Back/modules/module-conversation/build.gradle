apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':core:core-common')
    implementation project(':core:core-infra')
    implementation project(':core:core-webclient')
    implementation project(':core:core-grpc')
    implementation project(':core:core-data-serializer')
    implementation project(':core:core-outbox-message-relay')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    testImplementation 'io.grpc:grpc-inprocess:1.68.1'
    testImplementation 'io.grpc:grpc-testing:1.68.1'
}
