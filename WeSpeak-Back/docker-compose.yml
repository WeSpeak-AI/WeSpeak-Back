x-service-common: &service-common
  build:
    context: .
  depends_on:
    redis:
      condition: service_started
    kafka:
      condition: service_started
  networks:
    - default
    - wespeak-ai-net
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  environment: &common-env
    DB_USERNAME: ${DB_USERNAME:-root}
    DB_PASSWORD: ${DB_PASSWORD:-Abcd123@}
    # DB 장애가 해당 서비스 스레드만 블로킹하고 게이트웨이/다른 서비스로 전파되지 않도록 커넥션
    # 타임아웃을 짧게 설정(SC-001) — Spring Boot 완화 바인딩으로 코드 변경 없이 적용됨
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_HIKARI_CONNECTION_TIMEOUT:-3000}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    AI_SERVER_URL: http://wespeak-ai:8000
    TOKEN_SECRET: ${TOKEN_SECRET:-xG0DFZb7UoyqpZy6d02S9X-AkpRFSQ39Y5aXvssuF6YjS5_5b3lZNhEebf9E9f7oG8x1Pj0d_2S2r7LZokdHkQ==}
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.0
    container_name: wespeak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # ─── 서비스별 MySQL 인스턴스 (database-per-service, 아직 어떤 서비스도 연결되지 않음) ──────

  mysql-auth:
    image: mysql:8.0
    container_name: wespeak-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak_auth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-auth-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  mysql-user:
    image: mysql:8.0
    container_name: wespeak-mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak_user
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-user-data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  mysql-voca:
    image: mysql:8.0
    container_name: wespeak-mysql-voca
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak_voca
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-voca-data:/var/lib/mysql
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  mysql-writing:
    image: mysql:8.0
    container_name: wespeak-mysql-writing
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak_writing
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-writing-data:/var/lib/mysql
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  mysql-reading:
    image: mysql:8.0
    container_name: wespeak-mysql-reading
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak_reading
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-reading-data:/var/lib/mysql
    ports:
      - "3311:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  mysql-conversation:
    image: mysql:8.0
    container_name: wespeak-mysql-conversation
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Abcd123@}
      MYSQL_DATABASE: wespeak_conversation
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-conversation-data:/var/lib/mysql
    ports:
      - "3312:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Abcd123@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wespeak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: wespeak-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: wespeak-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ─── Spring Microservices ──────────────────────────────────────────────────

  auth-service:
    <<: *service-common
    container_name: wespeak-auth
    build:
      context: .
      args:
        MODULE_PATH: modules/module-auth
    depends_on:
      mysql-auth:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "9001:9001"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/wespeak_auth?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      NODE_ID: 1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  user-service:
    <<: *service-common
    container_name: wespeak-user
    build:
      context: .
      args:
        MODULE_PATH: modules/module-user
    depends_on:
      mysql-user:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "9002:9002"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/wespeak_user?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      NODE_ID: 2

  voca-service:
    <<: *service-common
    container_name: wespeak-voca
    build:
      context: .
      args:
        MODULE_PATH: modules/module-voca
    depends_on:
      mysql-voca:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "9003:9003"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-voca:3306/wespeak_voca?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      NODE_ID: 3
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}

  writing-service:
    <<: *service-common
    container_name: wespeak-writing
    build:
      context: .
      args:
        MODULE_PATH: modules/module-writing
    depends_on:
      mysql-writing:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "9004:9004"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-writing:3306/wespeak_writing?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      NODE_ID: 4

  reading-service:
    <<: *service-common
    container_name: wespeak-reading
    build:
      context: .
      args:
        MODULE_PATH: modules/module-reading
    depends_on:
      mysql-reading:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "9005:9005"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reading:3306/wespeak_reading?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      NODE_ID: 5
      USER_SERVICE_URL: http://user-service:9002
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}

  conversation-service:
    <<: *service-common
    container_name: wespeak-conversation
    build:
      context: .
      args:
        MODULE_PATH: modules/module-conversation
    depends_on:
      mysql-conversation:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "9006:9006"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-conversation:3306/wespeak_conversation?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      NODE_ID: 6

  search-service:
    container_name: wespeak-search
    build:
      context: .
      args:
        MODULE_PATH: modules/module-searchword
    ports:
      - "9007:9007"
    networks:
      - default
      - wespeak-ai-net
    environment:
      AI_SERVER_URL: http://wespeak-ai:8000
      NODE_ID: 7
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  api-gateway:
    container_name: wespeak-api-gateway
    build:
      context: .
      args:
        MODULE_PATH: api/api-gateway
    ports:
      - "9000:9000"
    depends_on:
      - auth-service
      - user-service
      - voca-service
      - writing-service
      - reading-service
      - conversation-service
      - search-service
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:-xG0DFZb7UoyqpZy6d02S9X-AkpRFSQ39Y5aXvssuF6YjS5_5b3lZNhEebf9E9f7oG8x1Pj0d_2S2r7LZokdHkQ==}
      AUTH_SERVICE_URL: http://auth-service:9001
      USER_SERVICE_URL: http://user-service:9002
      VOCA_SERVICE_URL: http://voca-service:9003
      WRITING_SERVICE_URL: http://writing-service:9004
      READING_SERVICE_URL: http://reading-service:9005
      CONVERSATION_SERVICE_URL: http://conversation-service:9006
      SEARCH_SERVICE_URL: http://search-service:9007
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

networks:
  default:
    name: wespeak-back_default
  wespeak-ai-net:
    external: true
    name: wespeak-ai_default

volumes:
  mysql-data:
  mysql-auth-data:
  mysql-user-data:
  mysql-voca-data:
  mysql-writing-data:
  mysql-reading-data:
  mysql-conversation-data:
  redis-data:
