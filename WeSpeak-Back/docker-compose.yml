x-service-common: &service-common
  build:
    context: .
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
    kafka:
      condition: service_started
  networks:
    - default
    - wespeak-ai-net
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  environment: &common-env
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wespeak?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    AI_SERVER_URL: http://wespeak-ai:8000
    TOKEN_SECRET: ${TOKEN_SECRET}
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.0
    container_name: wespeak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: wespeak
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wespeak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: wespeak-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: wespeak-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ─── Spring Microservices ──────────────────────────────────────────────────

  auth-service:
    <<: *service-common
    container_name: wespeak-auth
    build:
      context: .
      args:
        MODULE_PATH: modules/module-auth
    ports:
      - "9001:9001"
    environment:
      <<: *common-env
      NODE_ID: 1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-service:
    <<: *service-common
    container_name: wespeak-user
    build:
      context: .
      args:
        MODULE_PATH: modules/module-user
    ports:
      - "9002:9002"
    environment:
      <<: *common-env
      NODE_ID: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  voca-service:
    <<: *service-common
    container_name: wespeak-voca
    build:
      context: .
      args:
        MODULE_PATH: modules/module-voca
    ports:
      - "9003:9003"
    environment:
      <<: *common-env
      NODE_ID: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  writing-service:
    <<: *service-common
    container_name: wespeak-writing
    build:
      context: .
      args:
        MODULE_PATH: modules/module-writing
    ports:
      - "9004:9004"
    environment:
      <<: *common-env
      NODE_ID: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  reading-service:
    <<: *service-common
    container_name: wespeak-reading
    build:
      context: .
      args:
        MODULE_PATH: modules/module-reading
    ports:
      - "9005:9005"
    environment:
      <<: *common-env
      NODE_ID: 5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  conversation-service:
    <<: *service-common
    container_name: wespeak-conversation
    build:
      context: .
      args:
        MODULE_PATH: modules/module-conversation
    ports:
      - "9006:9006"
    environment:
      <<: *common-env
      NODE_ID: 6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9006/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  search-service:
    container_name: wespeak-search
    build:
      context: .
      args:
        MODULE_PATH: modules/module-searchword
    ports:
      - "9007:9007"
    networks:
      - default
      - wespeak-ai-net
    environment:
      AI_SERVER_URL: http://wespeak-ai:8000
      NODE_ID: 7
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9007/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  api-gateway:
    container_name: wespeak-api-gateway
    build:
      context: .
      args:
        MODULE_PATH: api/api-gateway
    ports:
      - "9000:9000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      voca-service:
        condition: service_healthy
      writing-service:
        condition: service_healthy
      reading-service:
        condition: service_healthy
      conversation-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET}
      AUTH_SERVICE_URL: http://auth-service:9001
      USER_SERVICE_URL: http://user-service:9002
      VOCA_SERVICE_URL: http://voca-service:9003
      WRITING_SERVICE_URL: http://writing-service:9004
      READING_SERVICE_URL: http://reading-service:9005
      CONVERSATION_SERVICE_URL: http://conversation-service:9006
      SEARCH_SERVICE_URL: http://search-service:9007
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wespeak-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: wespeak-loki
    ports:
      - "3100:3100"
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: wespeak-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: wespeak-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  default:
    name: wespeak-back_default
  wespeak-ai-net:
    external: true
    name: wespeak-ai_default

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
